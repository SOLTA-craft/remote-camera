<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote Cam">
<meta name="theme-color" content="#0c0e0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Remote Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 40%, #15191b 0%, #0c0e0f 55%, #070809 100%) fixed, #070809;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    color: #a6dbe6;
  }
  /* 390x844 で設計し、画面に合わせて拡大縮小 */
  .stage {
    width: 390px; height: 844px; flex: none;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 96px; box-sizing: border-box;
    transform-origin: center center;
  }
  h1 {
    margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .14em;
    text-shadow: 0 0 10px rgba(140,215,232,.35);
  }
  button {
    appearance: none; -webkit-appearance: none; background: none; border: 0;
    padding: 0; margin: 0; cursor: pointer; font: inherit; color: inherit;
  }
  button:focus-visible { outline: 2px solid #a6dbe6; outline-offset: 6px; border-radius: 999px; }

  .power { margin-top: 56px; width: 172px; height: 172px; display: flex; align-items: center; justify-content: center; }
  .power svg { transition: opacity .3s, filter .3s; filter: drop-shadow(0 0 10px rgba(140,215,232,.55)); }
  .power[aria-pressed="false"] svg { opacity: .35; filter: none; }

  .cams { margin-top: 72px; display: flex; flex-direction: column; gap: 44px; align-items: center; }
  .cam { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .cam-label { font-size: 17px; font-weight: 700; letter-spacing: .12em; color: #c9e6ec; }

  .switch {
    position: relative; width: 150px; height: 66px; border-radius: 999px; box-sizing: border-box; padding: 7px;
    background: linear-gradient(180deg, #a9cfd9 0%, #7fa9b6 55%, #6b95a3 100%);
    box-shadow: 0 6px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .track {
    display: block; position: relative; width: 100%; height: 100%; border-radius: 999px;
    background: linear-gradient(180deg, #0d1214 0%, #1a2327 100%);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,255,255,.08);
  }
  .txt {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    font-size: 17px; font-weight: 800; letter-spacing: .08em; transition: opacity .2s;
  }
  .txt.on  { left: 22px; color: #43e3b4; text-shadow: 0 0 8px rgba(67,227,180,.85), 0 0 18px rgba(67,227,180,.45); opacity: 0; }
  .txt.off { right: 18px; color: #e4483a; text-shadow: 0 0 8px rgba(228,72,58,.6); opacity: 1; }
  .switch[aria-checked="true"] .txt.on  { opacity: 1; }
  .switch[aria-checked="true"] .txt.off { opacity: 0; }

  .knob {
    position: absolute; top: 4px; left: 4px; width: 60px; height: 44px; border-radius: 999px;
    background: radial-gradient(120% 120% at 40% 25%, #d6eef3 0%, #a9d2dc 45%, #87b5c2 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 4px rgba(40,80,95,.4);
    transition: left .28s cubic-bezier(.4,1.3,.5,1);
  }
  .switch[aria-checked="true"] .knob { left: 72px; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1>REMOTE CAMERA</h1>

  <button class="power" type="button" aria-pressed="true" aria-label="Power">
    <svg width="172" height="172" viewBox="0 0 172 172" aria-hidden="true">
      <path d="M 52.6 33.8 A 62 62 0 1 0 119.4 33.8" fill="none" stroke="#a6dbe6" stroke-width="15" stroke-linecap="round"/>
      <line x1="86" y1="16" x2="86" y2="78" stroke="#a6dbe6" stroke-width="15" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="cams">
    <div class="cam">
      <span class="cam-label">CAM1</span>
      <button class="switch" type="button" role="switch" aria-checked="false" aria-label="CAM1">
        <span class="track"><span class="txt on">ON</span><span class="txt off">OFF</span><span class="knob"></span></span>
      </button>
    </div>
    <div class="cam">
      <span class="cam-label">CAM2</span>
      <button class="switch" type="button" role="switch" aria-checked="true" aria-label="CAM2">
        <span class="track"><span class="txt on">ON</span><span class="txt off">OFF</span><span class="knob"></span></span>
      </button>
    </div>
  </div>
</main>

<script>
  // 画面サイズに合わせて 390x844 のレイアウトを拡大縮小
  var stage = document.getElementById('stage');
  function fit() {
    var cs = getComputedStyle(document.body);
    var w = document.body.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = document.body.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
    var s = Math.min(w / 390, h / 844);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  fit();

  // トグル
  document.querySelectorAll('.switch').forEach(function (el) {
    el.addEventListener('click', function () {
      el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      if (navigator.vibrate) navigator.vibrate(10);
    });
  });
  var power = document.querySelector('.power');
  power.addEventListener('click', function () {
    power.setAttribute('aria-pressed', power.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });
</script>
</body>
</html>
